name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: revforge
          POSTGRES_PASSWORD: revforge
          POSTGRES_DB: revforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U revforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://revforge:revforge@localhost:5432/revforge
      SYSTEM_DATABASE_URL: postgres://revforge:revforge@localhost:5432/revforge
      REQUIRE_SCHEMA_DRIFT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck (tsc)
        run: npx tsc --noEmit

      - name: ESLint Check (lint)
        run: npm run lint

      - name: Unit & Integration Suites (vitest) + Schema Drift
        run: npm test

      - name: End-to-End Test Suite (playwright)
        run: npx playwright test

      - name: Acceptance Referee Audit (audit.mjs)
        run: node scripts/audit.mjs --all

      - name: Next.js Production Build
        run: npm run build
