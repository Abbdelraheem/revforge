name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck (tsc)
        run: npx tsc --noEmit

      - name: ESLint Check (lint)
        run: npm run lint

      - name: Unit & Integration Suites (vitest)
        run: npx vitest run

      - name: End-to-End Test Suite (playwright)
        run: npx playwright test

      - name: Acceptance Referee Audit (audit.mjs)
        run: node scripts/audit.mjs --all

      - name: Next.js Production Build
        run: npm run build
