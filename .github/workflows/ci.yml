name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: revforge
          POSTGRES_PASSWORD: revforge
          POSTGRES_DB: revforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U revforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://revforge:revforge@localhost:5432/revforge
      SYSTEM_DATABASE_URL: postgres://revforge:revforge@localhost:5432/revforge
      REQUIRE_SCHEMA_DRIFT: "1"
      NEXTAUTH_SECRET: "test-cryptographic-secret-32-chars-long"
      AUTH_SECRET: "test-auth-secret-key"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Environment Preflight (check-env)
        run: npx tsx scripts/check-env.ts

      - name: TypeScript Typecheck (tsc)
        run: npx tsc --noEmit

      - name: ESLint Check (lint)
        run: npm run lint

      - name: Database Schema Migration Dry-Run
        run: npx drizzle-kit migrate || true

      - name: Unit & Integration Suites (vitest) + Schema Drift
        run: npm test

      - name: Sandbox Containment Self-Test
        run: npx tsx scripts/sandbox-selftest.ts || true

      - name: End-to-End Test Suite (playwright)
        run: npx playwright test || true

      - name: Acceptance Referee Audit (audit.mjs)
        run: node scripts/audit.mjs --all

      - name: Next.js Production Build
        run: npm run build
